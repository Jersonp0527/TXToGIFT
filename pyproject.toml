[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "txt-to-gift"
version = "0.1.0"
description = "Convierte exámenes .docx a formato GIFT de Moodle"
requires-python = ">=3.9"
dependencies = ["python-docx>=1.1.0"]

[project.scripts]
txt-to-gift = "docx_to_gift:main"

[tool.setuptools]
py-modules = ["docx_to_gift"]
